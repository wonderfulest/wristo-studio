<!doctype html><meta charset="UTF-8"><title>WRT font import verification</title>
<div id="progress-app"></div>
<input type="file" multiple accept=".wrt"><pre id="result">Ready</pre>
<script type="module">
import {createPinia,setActivePinia} from 'pinia';
import {createApp} from 'vue';
import 'element-plus/dist/index.css';
import WrtImportProgressDialog from '/src/components/WrtImportProgressDialog.vue';
import {useWrtImportProgressStore} from '/src/stores/wrtImportProgress.ts';
import {readWrtDesignPackage,buildWrtDesignPackage} from '/src/engine/services/designAssetBundleService.ts';
import {packageFonts,packageFontBuildFiles} from '/src/engine/services/packageAssetRegistry.ts';
const pinia=createPinia();
setActivePinia(pinia);
createApp(WrtImportProgressDialog).use(pinia).mount('#progress-app');
const progress=useWrtImportProgressStore();
window.importProgress=progress;
window.results=[];
document.querySelector('input').onchange=async event=>{
 try {
  for(const file of event.target.files){
   document.querySelector('#result').textContent='Building '+file.name;
   const start=performance.now();
   progress.begin(file.name);
   const imported=await readWrtDesignPackage(file, progress.update);
   progress.finalize('saving');
   const fonts=[...packageFonts.keys()].map(slug=>({slug,files:packageFontBuildFiles.get(slug)?.size,preview:packageFonts.get(slug)?.bitmapPreviewAtlasUrl?.startsWith('blob:')}));
   const saved=await buildWrtDesignPackage(imported.config);
   const reopened=await readWrtDesignPackage(saved);
   window.results.push({file:file.name,fonts,failures:reopened.failures,elapsedMs:Math.round(performance.now()-start),bytes:saved.size});
  }
  document.querySelector('#result').textContent=JSON.stringify(window.results,null,2);
 }catch(error){document.querySelector('#result').textContent=error.stack;window.checkError=error.stack;}
 finally {progress.finish();}
};
</script>
